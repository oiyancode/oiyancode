name: Generate Contribution Snake

permissions:
  contents: write

on:
  schedule:
    # Roda uma vez por dia
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Jobs to update snake animation
    runs-on: ubuntu-latest
    steps:
      # PASSO 1: Baixa o código do seu repositório para o ambiente da Action. ESSENCIAL!
      - uses: actions/checkout@v4

      # PASSO 2: Agora sim, gera a animação da cobra (que cria a pasta 'dist')
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: oiyancode
          svg_out_path: dist/github-contribution-grid-snake.svg

      # PASSO 3: Publica o conteúdo da pasta 'dist' que foi criada no passo anterior
      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
