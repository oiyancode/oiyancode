# 1. Chave raiz (root key) 'name'
name: Generate Contribution Snake

# 2. Chave raiz 'permissions'
permissions:
  contents: write

# 3. Chave raiz 'on'
on:
  schedule:
    # Roda uma vez por dia
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

# 4. Chave raiz 'jobs'
jobs:
  build:
    name: Jobs to update snake animation
    runs-on: ubuntu-latest
    steps:
      # PASSO 1: Baixa o código do seu repositório.
      - uses: actions/checkout@v4

      # PASSO 2: CRIA O DIRETÓRIO 'dist' ANTECIPADAMENTE (Solução para o erro Build dir does not exist)
      - name: Create 'dist' directory
        run: mkdir -p dist

      # PASSO 3: Gera a animação da cobra.
      - uses: Platane/snk@v3
        with:
          github_user_name: oiyancode
          svg_out_path: dist/github-contribution-grid-snake.svg

      # PASSO 4: Publica o conteúdo.
      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
